# @package _global_
# Two nodes, four H100-80GB GPUs per node — Fir cluster (fir.alliancecan.ca)
# Fir has 160 GPU nodes with 4x H100-80GB each; max job time: 7 days
# Account: rrg-rudner (Rudner RAC grant on Alliance; verify with `sshare -u "$USER"`)

slurm:
  nodes: 2
  gres: gpu:h100:4
  ntasks_per_node: 4
  constraint: ~     # clears the Unity-specific vram40,bf16 constraint from train_sbatch.yaml
  partition: ~      # no partition flag needed; scheduler routes via --gres and --account
  account: rrg-rudner
  time: 7-00:00:00
  mem: 32G
