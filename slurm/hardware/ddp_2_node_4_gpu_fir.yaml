# @package _global_
# Two nodes, four H100-80GB SXM GPUs per node — Fir cluster (fir.alliancecan.ca)
# Fir has 160 GPU nodes with 4 H100-80GB each (640 GPUs total); max job time: 7 days
# Account: verify with `mybalance` on the cluster; rrg- prefix for RAC grants

slurm:
  nodes: 2
  gres: gpu:h100:4
  ntasks_per_node: 4
  constraint: ~     # clears the Unity-specific vram40,bf16 constraint from train_sbatch.yaml
  partition: ~      # no partition flag needed; scheduler routes via --gres and --account
  account: rrg-ttz-990
  time: 7-00:00:00
  mem: 200G
