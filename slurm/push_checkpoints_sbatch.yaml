defaults:
  - _self_
  - paths: default
  - hardware: 1_node_1_gpu

# Keep common utils
hydra:
  job:
    env_set:
      PROJECT_ROOT: "."
      OMP_NUM_THREADS: "1"
  searchpath:
    - file://${oc.env:PROJECT_ROOT,.}/configs/common
  run:
    dir: ${paths.output_dir}/sbatch/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.output_dir}/sbatch/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${oc.select:hydra.job.num,0}

# SLURM settings
slurm:
  job_name: ${job_name}
  nodes: 1
  mem: 20GB
  time: "2-00:00:00"
  partition: gpu
  constraint: vram40,bf16
  ntasks_per_node: 1
  cpus_per_task: 5
  gres: gpu:1
  open_mode: append
  requeue: true
  mail_type:
    - BEGIN
    - END
    - FAIL
    - REQUEUE
    - TIME_LIMIT_80
  mail_user: ${oc.env:USER,dhruveshpate@umass.edu}

env:
  HYDRA_FULL_ERROR: 1
  NCCL_NSOCKS_PERTHREAD: 4
  NCCL_SOCKET_NTHREADS: 2
  TORCH_LOGS: recompiles
  TQDM_MINITERS: 1000

push_checkpoints:
  checkpoints_dir: ???
  hub_repo_id: ???
  checkpoint_glob: "*.ckpt"
  # Python re; first group = epoch (unused), second = global step for branch name
  filename_pattern: "^(\\d+)-(\\d+)\\.ckpt$"
  branch_prefix: step
  include_special_named: false
  # submit: resolve file list when running submit_push_checkpoints.py (default).
  resolve_checkpoints_at: submit
  # lightning_ckpt: ++hub_checkpoint_path=...  |  model_only: ++model_only_checkpoint_path=... +skip_init_weights=True
  weight_source: lightning_ckpt

do: print # submit
job_name: ???
experiment: ???
use_job_name_as_id: false
