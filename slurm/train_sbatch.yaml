defaults:
  - _self_
  - paths: default
  - hardware: null

# Keep common utils
hydra:
  job:
    env_set:
      PROJECT_ROOT: "."
      OMP_NUM_THREADS: "1"
  searchpath:
    - file://${oc.env:PROJECT_ROOT,.}/configs/common
  # output directory for the sbatch generation script submit_train.py etc.
  run:
    dir: ${paths.output_dir}/sbatch/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.output_dir}/sbatch/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${oc.select:hydra.job.num,0}


# SLURM settings
slurm:
  # output file is set by the script typically to paths.logs_dir/%x.out
  job_name: ${job_name}
  nodes: 1
  mem: 20GB
  time: "20:00:00"
  partition: gpu
  constraint: vram40,bf16
  ntasks_per_node: 1 
  cpus_per_task: 5
  gres: gpu:1 
  open_mode: append
  requeue: true
  mail_type: 
    - BEGIN
    - END
    - FAIL
    - REQUEUE
    - TIME_LIMIT_80
  mail_user: ${oc.env:USER,dhruveshpate@umass.edu}

# Environment variables
env:
  HYDRA_FULL_ERROR: 1
  NCCL_NSOCKS_PERTHREAD: 4
  NCCL_SOCKET_NTHREADS: 2
  TORCH_LOGS: recompiles
  TQDM_MINITERS: 1000
  # # --- Distributed / NCCL debugging (pinpoint collective source + faster hang detection) ---
  # # PyTorch: verbose distributed logging (collectives, PG init, etc.)
  # TORCH_DISTRIBUTED_DEBUG: DETAIL
  # # NCCL watchdog timeout in seconds (default is 1800 = 30 min). Lower = fail faster on deadlocks.
  # # 600s (10 min) balances fast feedback vs slow legitimate collectives on IB; raise if you see spurious timeouts.
  # TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: 600
  # # Flight recorder: stack traces for NCCL work (enables "Stack trace of the failed collective" dumps)
  # TORCH_NCCL_TRACE_BUFFER_SIZE: 16777216
  # # Extra dumps / desync reports on timeout or mismatch (noisy; disable for production throughput)
  # TORCH_NCCL_DUMP_ON_TIMEOUT: 1
  # TORCH_NCCL_DESYNC_DEBUG: 1
  # TORCH_NCCL_TRACE_CPP_STACK: 1
  # TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
  # # NCCL library logging (not Python stacks; useful for transport/COLL ordering)
  # NCCL_DEBUG: INFO
  # NCCL_DEBUG_SUBSYS: COLL

# Training configuration
train:
  experiment: ???
  debug: null
  batch_size: 64 # per device batch size, global is set by the main config
  compile: false
  precision: bf16-mixed
  job_type: train
  num_nodes: ${slurm.nodes}
  devices: ${parse_gpu_count:${slurm.gres}}
  hooks: false
  trainer_strategy: ${determine_trainer_strategy:${slurm.ntasks_per_node},${slurm.nodes},${.hooks}}
  loggers: wandb

do: print # submit
job_name: ???
use_job_name_as_id: true