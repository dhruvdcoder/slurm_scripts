defaults:
  - _self_
  - paths: default
  - hardware: null

# Keep common utils
hydra:
  job:
    env_set:
      PROJECT_ROOT: "."
      OMP_NUM_THREADS: "1"
  searchpath:
    - file://${oc.env:PROJECT_ROOT,.}/configs/common
  # output directory for the sbatch generation script submit_train.py etc.
  run:
    dir: ${paths.output_dir}/sbatch/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.output_dir}/sbatch/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${oc.select:hydra.job.num,0}


# SLURM settings
slurm:
  # output file is set by the script typically to paths.logs_dir/%x.out
  job_name: ${job_name}
  nodes: 1
  mem: 20GB
  time: "20:00:00"
  partition: gpu
  constraint: vram40,bf16
  ntasks_per_node: 1 
  cpus_per_task: 5
  gres: gpu:1 
  open_mode: append
  requeue: true
  mail_type: ~
  mail_user: ~

# Commands run at the top of the sbatch script, before env exports and srun.
# Use for cluster-specific module loading and venv activation.
pre_cmd: []

# Environment variables
env:
  HYDRA_FULL_ERROR: 1
  TORCH_LOGS: recompiles
  TQDM_MINITERS: 1000
  # --- Distributed / NCCL (faster hang detection; debug vars stripped for production) ---
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: 600
  TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
  # Flight recorder: captures stack traces if a collective times out
  TORCH_FR_BUFFER_SIZE: 16777216
  TORCH_NCCL_DUMP_ON_TIMEOUT: 1
  TORCH_FR_CPP_STACK: 1
  # NCCL socket tuning
  NCCL_NSOCKS_PERTHREAD: 4
  NCCL_SOCKET_NTHREADS: 2
  # --- Uncomment below for debugging hangs/collective failures ---
  # TORCH_DISTRIBUTED_DEBUG: DETAIL   # verbose Python-level distributed logging
  # TORCH_NCCL_DESYNC_DEBUG: 1        # noisy desync reports
  # NCCL_DEBUG: INFO                  # logs every collective — 99% of output when enabled
  # NCCL_DEBUG_SUBSYS: COLL           # companion to NCCL_DEBUG

# Training configuration
train:
  experiment: ???
  debug: null
  batch_size: 64 # per device batch size, global is set by the main config
  compile: false
  precision: bf16-mixed
  job_type: train
  num_nodes: ${slurm.nodes}
  devices: ${parse_gpu_count:${slurm.gres}}
  hooks: false
  trainer_strategy: ${determine_trainer_strategy:${slurm.ntasks_per_node},${slurm.nodes},${.hooks}}
  loggers: wandb

do: print # submit
job_name: ???
use_job_name_as_id: true
